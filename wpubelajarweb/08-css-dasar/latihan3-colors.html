<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotes i live by</title>
    <style>
    body {
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        color: #f8f8ff;
        text-align: center;
        background-color: #172239;
    }

    h1 {
        font-size: 48px;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 10px;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: #374460;
        text-shadow: 2px 2px 0px rgba(215, 28, 28, 0.8);
    }

    .quote {
        font-size: 22px;
        line-height: 2.2;
        word-spacing: 5px;
    }

    span {
        color: crimson;
        text-decoration: line-through;
    }

    .credit {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgb(151 151 151 / 70%);
        font-weight: normal;
    }
    </style>
</head>

<body>
    <h1>Quotes i live by</h1>
    <p class="quote">"You never <span>fail</span> until you stop trying"</p>
    <p class="credit">- Albert Einstein</p>
</body>
</html>
