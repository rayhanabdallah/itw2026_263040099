<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotes i live by</title>
    <style>
    body {
        font-family: 'Courier New', Courier, monospace;
        font-weight: bold;
        color: #f8f8ff;
        text-align: center;
        background-color: #172239;
        background-image: linear-gradient(to bottom, rgb(15 23 42 / 90%), rgb(15 23 42 / 50%)), url(https://fastly.picsum.photos/id/58/1280/853.jpg?hmac=YO3QnOm9TpyM5DqsJjoM4CHg8oIq4cMWLpd9ALoP908);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
    }

    h1 {
        font-size: 4em;
        text-transform: uppercase;
        font-style: italic;
        letter-spacing: 10px;
        text-decoration: none;
        text-decoration-style: wavy;
        text-decoration-color: #374460;
        /* text-shadow: 2px 2px 0px rgba(215, 28, 28, 0.8) ; */
        background-image: linear-gradient(to right, rgb(227, 247, 10) 34%, rgb(25, 199, 135));
        background-clip: text;
        color: transparent  ;
        filter: drop-shadow(0 0 10px rgba(33, 237, 10, 0.4));
    }

    .quote {
        font-size: 22px;
        line-height: 2.2;
        word-spacing: 5px;
        background-color: rgb(255 255 255 /5%);
        max-width: 700px;
        margin: auto;
        padding: 30px;
        border-radius: 20px;
        border: 1px solid rgb(255 255 255 / 10%);
        box-shadow: 0 10px 30px rgb(0 0 0 / 50%)
    }

    span {
        color: crimson;
        text-decoration: line-through;
        text-shadow: 0 0 10px crimson;
    }

    .credit {
        font-size: 12px;
        letter-spacing: 2px;
        color: rgb(151 151 151 / 70%);
        font-weight: normal;
        text-transform: uppercase;
        border-top: 1px solid rgb 255 255 255 / 20%;
        width: 30%;
        margin: 1% auto;
        padding-top: 0.5;
    }
    </style>
</head>

<body>
    <h1>Quotes i live by</h1>
    <p class="quote">"You never <span>fail</span> until you stop trying"</p>
    <p class="credit">- Albert Einstein</p>
</body>
</html>
