<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Background</title>
    <style>
        body {
            background-color: lightskyblue;
            background-image: linear-gradient(20deg, purple 20%, blueviolet);
            height: 100vh;
        }

        .kotak1 {
            width: 200px;
            height: 200px;
            background-color: olive;
            background-image: linear-gradient(to top, blue, lightblue);
        }

        .kotak2 {
            width: 200px;
            height: 200px;
            background-color: olive;
            background-image: radial-gradient(salmon, yellow);
        }

        .kotak3 {
            width: 200px;
            height: 200px;
            background-color: olive;
            background-image: conic-gradient(rgb(255, 3, 171), lightblue, red);
        }
    </style>
</head>

<body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
</body>
</html>
