<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Text - Text Overflow & Text Shadow</title>
    <style>
        p {
            font-size: 26px;
            white-space: nowrap;
            width: 300px;
            background-color: lightsalmon;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        h1 {
            color: violet;
            font-size: 100px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            text-shadow: 5px 5px 0px purple;
            text-decoration: underline overline;
            text-decoration-style: dotted;
            text-decoration-color: violet;
            text-decoration-skip-ink: none;
            /* text-shadow: 5px 5px 0px purple; 3D Effect*/
            /* text-shadow: 2px 3px 2px blueviolet, 0px -10px 5px purple; BERTUMPUK*/
        }
    </style>
</head>

<body>
    <h1>Hello CSS</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Rem accusantium aliquam voluptas excepturi aliquid expedita neque cupiditate eos laborum nemo esse sit consequuntur, nobis itaque unde officia. Praesentium, velit aliquid?</p>
</body>
</html>
